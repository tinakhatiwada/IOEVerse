services:
  - type: web
    name: ioeverse
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ioeverse-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000

databases:
  - name: ioeverse-db
    plan: free
    postgresMajorVersion: 16
    ipAllowList: []
