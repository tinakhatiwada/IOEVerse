services:
  - type: web
    name: ioeverse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ioeverse-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true

databases:
  - name: ioeverse-db
    plan: free
    postgresMajorVersion: 16
    ipAllowList: []
