<!-- ========================================================
     IOEverse Global AI Chat Widget
     Include this block at the end of every page's <body>.
     The widget reads window.CHAT_SUBJECT (optional) to
     filter AI answers to the current subject.
     ======================================================== -->
<style>
  #ioe-chat-fab {
    position: fixed; bottom: 28px; right: 28px; z-index: 9000;
    width: 52px; height: 52px; border-radius: 50%;
    background: #6366f1; border: none; cursor: pointer;
    box-shadow: 0 4px 20px rgba(99,102,241,0.5);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #ioe-chat-fab:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(99,102,241,0.65); }
  #ioe-chat-fab svg { width: 24px; height: 24px; fill: #fff; }
  #ioe-chat-fab .close-icon { display: none; }
  #ioe-chat-fab.open .chat-icon { display: none; }
  #ioe-chat-fab.open .close-icon { display: block; }

  #ioe-chat-panel {
    position: fixed; bottom: 92px; right: 28px; z-index: 8999;
    width: 360px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18); border: 1px solid #e5e7eb;
    display: none; flex-direction: column;
    animation: chatSlideUp 0.25s ease;
    font-family: 'Inter', sans-serif;
  }
  #ioe-chat-panel.open { display: flex; }
  @keyframes chatSlideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

  .ioe-chat-head {
    background: #0f1f3d; padding: 16px 20px;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .ioe-chat-avatar {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg,#6366f1,#818cf8);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .ioe-chat-avatar svg { width: 18px; height: 18px; fill: #fff; }
  .ioe-chat-head-info strong { display: block; color: #fff; font-size: 14px; font-weight: 700; }
  .ioe-chat-head-info span { color: rgba(255,255,255,0.5); font-size: 11px; }
  .ioe-online-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; margin-left: auto; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1;}50%{opacity:0.4;} }

  .ioe-chat-msgs {
    flex: 1; height: 300px; overflow-y: auto;
    padding: 16px; background: #f9fafb;
    display: flex; flex-direction: column; gap: 10px;
  }
  .ioe-msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.55; word-break: break-word; }
  .ioe-msg.ai { background: #fff; color: #0f1f3d; border: 1px solid #e5e7eb; align-self: flex-start; border-radius: 4px 12px 12px 12px; }
  .ioe-msg.user { background: #6366f1; color: #fff; align-self: flex-end; border-radius: 12px 4px 12px 12px; }
  .ioe-msg.typing { color: #6b7280; font-style: italic; background: #fff; border: 1px solid #e5e7eb; align-self: flex-start; border-radius: 4px 12px 12px 12px; }
  .ioe-msg.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; align-self: flex-start; border-radius: 4px 12px 12px 12px; }

  .ioe-chat-subject-bar {
    background: rgba(99,102,241,0.06); border-top: 1px solid #e5e7eb;
    padding: 6px 16px; font-size: 11px; color: #6b7280; display: flex; align-items: center; gap: 6px;
  }
  .ioe-chat-subject-bar span { font-weight: 600; color: #6366f1; }

  .ioe-chat-input-wrap {
    padding: 12px 16px; border-top: 1px solid #e5e7eb;
    display: flex; gap: 8px; background: #fff; flex-shrink: 0;
  }
  .ioe-chat-input {
    flex: 1; border: 1.5px solid #e5e7eb; border-radius: 8px;
    padding: 9px 12px; font-size: 13px; font-family: 'Inter', sans-serif;
    outline: none; color: #0f1f3d; transition: border-color 0.2s;
    resize: none;
  }
  .ioe-chat-input:focus { border-color: #6366f1; }
  .ioe-send-btn {
    background: #6366f1; color: #fff; border: none; border-radius: 8px;
    padding: 9px 14px; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
  }
  .ioe-send-btn:hover { background: #4f46e5; }
  .ioe-send-btn:disabled { background: #d1d5db; cursor: not-allowed; }
  .ioe-send-btn svg { width: 16px; height: 16px; fill: #fff; display: block; }

  @media(max-width:480px) { #ioe-chat-panel{width:calc(100vw - 24px); right:12px; bottom:80px;} #ioe-chat-fab{right:16px;bottom:16px;} }
</style>

<!-- FAB Button -->
<button id="ioe-chat-fab" aria-label="Toggle AI Chat" onclick="ioeToggleChat()">
  <svg class="chat-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
  <svg class="close-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
</button>

<!-- Chat Panel -->
<div id="ioe-chat-panel">
  <div class="ioe-chat-head">
    <div class="ioe-chat-avatar">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
    </div>
    <div class="ioe-chat-head-info">
      <strong>AI Study Assistant</strong>
      <span>Powered by IOEverse RAG</span>
    </div>
    <div class="ioe-online-dot"></div>
  </div>

  <div id="ioe-chat-msgs" class="ioe-chat-msgs">
    <div class="ioe-msg ai">Hello! I am your AI study assistant. Ask me anything about your IOE syllabus and I will answer from your course materials.</div>
  </div>

  <div class="ioe-chat-subject-bar" id="ioe-subject-bar" style="display:none">
    Filtered to: <span id="ioe-subject-label"></span>
  </div>

  <div class="ioe-chat-input-wrap">
    <input type="text" class="ioe-chat-input" id="ioe-chat-input" placeholder="Ask about any topic..." />
    <button class="ioe-send-btn" id="ioe-send-btn" onclick="ioeSend()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
(function() {
  function ioeToggleChat() {
    const fab = document.getElementById('ioe-chat-fab');
    const panel = document.getElementById('ioe-chat-panel');
    fab.classList.toggle('open');
    panel.classList.toggle('open');

    // Show subject filter bar if a subject is set
    const subj = window.CHAT_SUBJECT || null;
    if (subj) {
      document.getElementById('ioe-subject-bar').style.display = 'flex';
      document.getElementById('ioe-subject-label').textContent = subj;
    }

    if (panel.classList.contains('open')) {
      document.getElementById('ioe-chat-input').focus();
    }
  }
  window.ioeToggleChat = ioeToggleChat;

  function ioeAddMsg(text, type) {
    const box = document.getElementById('ioe-chat-msgs');
    const div = document.createElement('div');
    div.className = 'ioe-msg ' + type;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  async function ioeSend() {
    const input = document.getElementById('ioe-chat-input');
    const btn = document.getElementById('ioe-send-btn');
    const q = input.value.trim();
    if (!q) return;

    ioeAddMsg(q, 'user');
    input.value = '';
    btn.disabled = true;

    const typing = ioeAddMsg('Thinking...', 'typing');

    try {
      const body = { question: q };
      if (window.CHAT_SUBJECT) body.subject = window.CHAT_SUBJECT;
      if (window.CHAT_CHAPTER) body.chapter = window.CHAT_CHAPTER;

      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      typing.remove();

      if (data.answer) {
        ioeAddMsg(data.answer, 'ai');
      } else if (data.error) {
        ioeAddMsg('Error: ' + data.error, 'error');
      } else {
        ioeAddMsg('No answer found. Try rephrasing your question.', 'error');
      }
    } catch (err) {
      typing.remove();
      ioeAddMsg('Connection error. Please try again.', 'error');
    }

    btn.disabled = false;
    document.getElementById('ioe-chat-input').focus();
  }
  window.ioeSend = ioeSend;

  // Enter key to send
  document.getElementById('ioe-chat-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ioeSend(); }
  });
})();
</script>
